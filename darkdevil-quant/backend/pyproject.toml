[project]
name = "darkdevil-quant-backend"
version = "0.1.0"
description = "DarkDevil Quant - multi-exchange trading platform backend (Milestone 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "httpx>=0.27,<1.0",
    "websockets>=13.0",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# test conftest intentionally sets DJQ_* env vars before importing the app
"tests/conftest.py" = ["E402"]
